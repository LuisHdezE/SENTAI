      commercial.customer.maintain y conflicto persistente independiente permanecen explicitamente deferred
      y no autorizan inventar endpoints. api_contract_ready queda PASS en este estado propuesto.
      API Implementation permanece NOT_STARTED hasta merge humano de este cierre.
  api_implementation:
    status: IN_PROGRESS
    progress: 41
    note: >-
      I1 Foundation & Architecture Guard completado en EVD-API-IMPL-001.
      I2 Identity & Cross-Cutting Foundation completado en EVD-API-IMPL-002.
      I3 Master Data completado y READY_FOR_REVIEW en EVD-API-IMPL-003.
      I2 aporta API-AUTH-001..006. I3 aporta quince operaciones Master Data para Products,
      Customers, Warehouses, Zones y Locations, con Web session, admin.masters.maintain,
      idempotencia durable en mutaciones y admin.masters.changed transaccional.
      Cobertura contractual acumulada: 21/51 operaciones activas; restan 30.
      CI del implementation head I3 PASS: 52 tests / 230 assertions; architecture guard 34/34 PASS; Pint PASS.
