name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sentai_test
      DB_USERNAME: sentai_ci
      DB_PASSWORD: sentai_ci
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --no-check-publish

      - name: Prepare ephemeral Laravel environment
        run: cp .env.example .env

      - name: Prepare native MySQL test database
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot <<'SQL'
          CREATE DATABASE IF NOT EXISTS sentai_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'sentai_ci'@'%' IDENTIFIED BY 'sentai_ci';
          GRANT ALL PRIVILEGES ON sentai_test.* TO 'sentai_ci'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend tests
        run: composer test

      - name: Run architecture fitness tests
        run: composer test:architecture

      - name: Check formatting
        run: composer lint
